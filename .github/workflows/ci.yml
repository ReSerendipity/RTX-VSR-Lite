# RTX_VSR-lite: minimal Python CI (offline unittest, zero third-party deps)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install minimal deps (numpy only; torch/cv2 stubbed in tests)
        run: python -m pip install --quiet numpy
      - name: Run offline unit tests (torch/cv2 stubbed when absent)
        run: python -m unittest discover -s tests -v
